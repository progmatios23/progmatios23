<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <defs>
    <style>
      .main { font-family: 'Courier New', Courier, monospace; font-size: 15px; font-weight: 900; fill: #111111; }
      .sub { font-family: 'Courier New', Courier, monospace; font-size: 9px; font-weight: 800; fill: #00599c; letter-spacing: 0.5px; }
    </style>
  </defs>
  <!-- Drop shadow -->
  <rect x="3" y="3" width="58" height="58" fill="#0d1117"/>
  
  <!-- Outer border -->
  <rect x="0" y="0" width="58" height="58" fill="#111111"/>
  
  <!-- Inner face -->
  <rect x="2" y="2" width="54" height="54" fill="#fbfaf6"/>
  
  <!-- 3D Bevel Highlight -->
  <rect x="2" y="2" width="54" height="2" fill="#ffffff"/>
  <rect x="2" y="2" width="2" height="54" fill="#ffffff"/>
  
  <!-- 3D Bevel Shadow -->
  <rect x="2" y="54" width="54" height="2" fill="#b9b5aa"/>
  <rect x="54" y="2" width="2" height="54" fill="#b9b5aa"/>
  
  <!-- Accent top bar -->
  <rect x="5" y="6" width="48" height="3" fill="#00599c"/>
  
  <!-- Center glyph / text -->
  <text x="29" y="33" class="main" text-anchor="middle">C</text>
  <text x="29" y="47" class="sub" text-anchor="middle">LANG</text>
</svg>